<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Snapzy Signature Gradient -->
    <linearGradient id="snapzy-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928CA" />
      <stop offset="28%" stop-color="#9333EA" />
      <stop offset="55%" stop-color="#EC4899" />
      <stop offset="78%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>

    <!-- Subtle lighting highlight overlay -->
    <radialGradient id="snapzy-glow" cx="25%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Dimensional Drop Shadow for Camera -->
    <filter id="icon-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#3B0764" flood-opacity="0.32" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.2" />
    </filter>

    <!-- Subtle Glass Inner Border -->
    <linearGradient id="inner-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Full Squircle App Badge -->
  <rect width="512" height="512" rx="124" fill="url(#snapzy-bg)" />

  <!-- Specular Ambient Highlight -->
  <rect width="512" height="512" rx="124" fill="url(#snapzy-glow)" />

  <!-- Crisp Inner Bevel Ring -->
  <rect x="1.5" y="1.5" width="509" height="509" rx="122.5" fill="none" stroke="url(#inner-border)" stroke-width="3" />

  <!-- Snapzy Camera Icon -->
  <g filter="url(#icon-shadow)">
    <g transform="translate(46, 46) scale(17.5)">
      <!-- Camera Outer Body -->
      <path
        d="M13.997 4a2 2 0 0 1 1.76 1.05l.486.9A2 2 0 0 0 18.003 7H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1.997a2 2 0 0 0 1.759-1.048l.489-.904A2 2 0 0 1 10.004 4z"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="2.1"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <!-- Lens Outer Ring -->
      <circle
        cx="12"
        cy="13"
        r="3.25"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="2.1"
      />
      <!-- Lens Core Aperture Pupil -->
      <circle
        cx="12"
        cy="13"
        r="1.15"
        fill="#FFFFFF"
      />
      <!-- Flash Indicator Dot -->
      <circle
        cx="17.6"
        cy="9.8"
        r="0.95"
        fill="#FFFFFF"
      />
    </g>
  </g>
</svg>